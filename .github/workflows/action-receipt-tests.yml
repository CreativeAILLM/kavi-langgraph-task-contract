name: Action receipt examples

on:
  push:
    paths:
      - "examples/agent-action-receipt/**"
      - ".github/workflows/action-receipt-tests.yml"
  pull_request:
    paths:
      - "examples/agent-action-receipt/**"
      - ".github/workflows/action-receipt-tests.yml"

permissions:
  contents: read

jobs:
  receipt-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check sender and receiver idempotency tests
        working-directory: examples/agent-action-receipt
        run: python -m unittest -v test_agent_action_receipt.py test_booking_receiver.py
